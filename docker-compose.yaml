# Production orchestration for CS Mentor (Coolify "Docker Compose" build pack).
#
# Architecture: a single public origin (csmentor.feraswe.com) served by the
# frontend's nginx. nginx reverse-proxies /api/* to the backend over this
# private Docker network, so the backend needs NO public route, NO subdomain,
# and NO external DNS. The app is fully self-contained and stays up regardless
# of the local development machine.
#
# Coolify (Docker Compose build pack) only creates a Traefik edge router when a
# service declares the magic SERVICE_FQDN_<SERVICE>_<PORT> variable. That var is
# what attaches the `frontend` service to Coolify's proxy network and generates
# the Traefik labels + TLS. Without it, the stack deploys healthy but has NO
# public listener -> ERR_CONNECTION_REFUSED. Only `frontend` gets an FQDN, so
# the backend stays private.

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    networks:
      - internal
    environment:
      # Same-origin requests no longer trigger CORS, but keep a sane explicit
      # value for any direct/external callers. Override in Coolify if needed.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://csmentor.feraswe.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      RATE_LIMIT: ${RATE_LIMIT:-20/minute}
    # Internal only — reachable from `frontend` as http://backend:8000.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
    environment:
      # Declares frontend:80 as the public service. Coolify generates the
      # Traefik router/labels and attaches its proxy network from this. Set the
      # actual domain (csmentor.feraswe.com) on this service in the Coolify UI;
      # the "/" pins the route to the site root.
      - SERVICE_FQDN_FRONTEND_80=/
    # The single public-facing service. Coolify's Traefik routes the FQDN here.
    expose:
      - "80"

networks:
  internal:
    driver: bridge
